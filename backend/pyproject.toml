[project]
name = "secaudit"
version = "0.1.0"
description = "Multi-agent framework for automated security auditing and vulnerability scanning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.10",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secaudit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long docstring lines are allowed
# Agent modules intentionally use PascalCase filenames (see CLAUDE.md).
per-file-ignores = { "src/secaudit/agents/*.py" = ["N999"], "src/secaudit/db/MongoManager.py" = ["N999"], "tests/**" = ["S101"] }

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
