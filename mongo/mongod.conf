# Hardened baseline. Dev compose leaves TLS off. Production MUST set net.tls.mode: requireTLS.
net:
  port: 27017
  bindIp: 0.0.0.0          # reachable only on the private docker network; never publish 27017 publicly
  # tls:
  #   mode: requireTLS
  #   certificateKeyFile: /etc/mongo/tls/server.pem
  #   CAFile: /etc/mongo/tls/ca.pem
  #   disabledProtocols: TLS1_0,TLS1_1

security:
  authorization: enabled
  javascriptEnabled: false  # blocks $where / $function / mapReduce JS

setParameter:
  authenticationMechanisms: SCRAM-SHA-256
  enableLocalhostAuthBypass: false
